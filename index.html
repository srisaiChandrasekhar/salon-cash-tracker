    --expense: #f0a27c;
    --expense-soft: #3a2a20;
    --shop: #9bc2e0;
    --shop-soft: #22323f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', 'Noto Sans Devanagari', 'Noto Sans Arabic', 'Noto Sans Bengali', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  h1, h2, h3, .num { font-family: 'Sora', system-ui, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  /* ---------- Top bar ---------- */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .logo-badge { width: 38px; height: 38px; border-radius: 10px; background: #efebe1; display: flex; align-items: center; justify-content: center; overflow: hidden; flex: 0 0 auto; }
  .logo-badge img { width: 100%; height: 100%; object-fit: contain; }
  .shopname { font-size: 17px; font-weight: 700; }
  .today-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ---------- Main scroll area ---------- */
  .main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 16px 90px;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }

  /* ---------- Bottom nav ---------- */
  .navbar {
    flex: 0 0 auto;
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .navbtn {
    flex: 1;
    border: none;
    background: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 4px;
    border-radius: 10px;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .navbtn svg { width: 22px; height: 22px; }
  .navbtn.active { color: var(--accent); background: var(--accent-soft); }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 20px 2px 8px;
  }
  .section-label:first-child { margin-top: 0; }

  /* Hero net tile */
  .hero {
    padding: 22px 20px;
    text-align: center;
  }
  .hero .label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .hero .amount { font-size: 42px; font-weight: 800; margin-top: 4px; }
  .hero .amount.neg { color: var(--expense); }
  .hero .amount.pos { color: var(--income); }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .tile { padding: 14px; border-radius: 12px; }
  .tile.income { background: var(--income-soft); }
  .tile.expense { background: var(--expense-soft); }
  .tile.shop { background: var(--shop-soft); grid-column: 1 / -1; }
  .tile .tlabel { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .tile.income .tlabel { color: var(--income); }
  .tile.expense .tlabel { color: var(--expense); }
  .tile.shop .tlabel { color: var(--shop); }
  .tile .tval { font-size: 22px; font-weight: 700; margin-top: 2px; }

  /* worker rows */
  .worker-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .worker-row:last-child { border-bottom: none; }
  .worker-name { font-weight: 600; font-size: 14px; }
  .worker-count { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .worker-amt { font-size: 17px; font-weight: 700; }

  /* action buttons */
  .actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .bigbtn {
    border: none;
    border-radius: 12px;
    padding: 16px 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .bigbtn.collect { background: var(--income); color: #ffffff; }
  .bigbtn.spend { background: var(--expense); color: #ffffff; }
  .bigbtn.shopbtn { background: var(--shop); color: #ffffff; grid-column: 1 / -1; }
  .bigbtn svg { width: 22px; height: 22px; }

  /* entry list */
  .entry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .entry:last-child { border-bottom: none; }
  .entry-icon {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto; font-size: 15px; font-weight: 700;
  }
  .entry-icon.income { background: var(--income-soft); color: var(--income); }
  .entry-icon.expense { background: var(--expense-soft); color: var(--expense); }
  .entry-icon.shop { background: var(--shop-soft); color: var(--shop); }
  .entry-body { flex: 1 1 auto; min-width: 0; }
  .entry-title { font-size: 14px; font-weight: 600; }
  .entry-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-amt { font-size: 15px; font-weight: 700; flex: 0 0 auto; }
  .entry-amt.income { color: var(--income); }
  .entry-amt.expense { color: var(--expense); }
  .entry-amt.shop { color: var(--shop); }
  .entry-del {
    flex: 0 0 auto; border: none; background: none; color: var(--text-muted);
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .entry-del:active { background: var(--surface-sunk); }

  .empty-state { padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,16,17,0.45);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50;
  }
  .sheet {
    background: var(--surface);
    width: 100%; max-width: 480px;
    border-radius: 18px 18px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    max-height: 88vh;
    overflow-y: auto;
  }
  .sheet-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
  .field-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin: 14px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--border); background: var(--surface);
    border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 600;
    color: var(--text); cursor: pointer;
  }
  .chip.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .amount-input-wrap { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--border); padding: 6px 2px; }
  .amount-input-wrap.focused { border-color: var(--accent); }
  .currency-sym { font-size: 24px; font-weight: 700; color: var(--text-muted); }
  .amount-input {
    border: none; background: none; outline: none; font-size: 34px; font-weight: 800;
    color: var(--text); width: 100%; font-family: 'Sora', sans-serif; font-variant-numeric: tabular-nums;
  }
  .text-input, .select-input {
    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
    padding: 11px 12px; font-size: 14px; background: var(--surface); color: var(--text); outline: none;
    font-family: inherit;
  }
  .text-input:focus, .select-input:focus { border-color: var(--accent); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1; border: none; border-radius: 10px; padding: 13px; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: var(--surface-sunk); color: var(--text); }
  .btn:disabled { opacity: 0.45; }

  /* history */
  .range-tabs { display: flex; gap: 6px; background: var(--surface-sunk); border-radius: 10px; padding: 4px; margin-bottom: 14px; }
  .range-tab { flex: 1; border: none; background: none; padding: 8px 4px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
  .range-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .day-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .day-row:last-child { border-bottom: none; }
  .day-date { font-size: 14px; font-weight: 600; }
  .day-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .day-net { font-size: 15px; font-weight: 700; }
  .chev { color: var(--text-muted); font-size: 13px; margin-left: 8px; margin-right: 8px; }

  /* settings */
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); gap: 10px; }
  .settings-row:last-child { border-bottom: none; }
  .settings-row.stack { flex-direction: column; align-items: stretch; }
  .icon-btn { border: none; background: none; color: var(--text-muted); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn:active { background: var(--surface-sunk); }
  .add-worker-row { display: flex; gap: 8px; padding: 12px 14px; }

  .toast {
    position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 600; z-index: 80; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }

  .confirm-box { padding: 20px; }
  .confirm-text { font-size: 14px; color: var(--text-muted); margin: 8px 0 18px; line-height: 1.5; }

  /* ---------- Auth screen ---------- */
  body.auth-mode .navbar { display: none; }
  .auth-wrap { display: flex; justify-content: center; padding-top: 24px; }
  .auth-card { width: 100%; max-width: 380px; padding: 24px 22px; }
  .auth-title { font-size: 19px; font-weight: 700; margin: 0 0 16px; }
  .auth-card .field-label:first-of-type { margin-top: 0; }
  .auth-error {
    background: var(--expense-soft); color: var(--expense); font-size: 13px;
    padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; line-height: 1.4;
  }
  .auth-links { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; text-align: center; }
  .auth-links a { color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; }
  .auth-note { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin: 0 0 16px; }
  .recovery-code {
    font-family: 'Sora', system-ui, sans-serif; font-size: 22px; font-weight: 700;
    letter-spacing: 0.04em; text-align: center; background: var(--surface-sunk);
    border-radius: 10px; padding: 14px; margin: 6px 0 16px; word-break: break-all;
  }
</style>
</head>

// Best-guess currency/language from the browser's own locale, used only to
// pre-fill a sensible default for a brand-new shop at signup. The owner can
// always change both later in Settings.
function detectDefaultsFromLocale() {
  const locales = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en-US']);
  const loc = (locales[0] || 'en-US').toLowerCase();
  const [langPart, regionPart] = loc.split('-');

  // Currency follows region (where the shop physically is), not language —
  // an en-IN browser is still an Indian shop and should default to INR.
  const REGION_CURRENCY = { in: 'INR', sa: 'SAR', bd: 'BDT', pk: 'PKR' };
  const currency = REGION_CURRENCY[regionPart] || 'USD';

  // Language follows the browser's language tag, but only to a language we
  // actually support — otherwise fall back to English rather than guessing.
  const SUPPORTED_LANGS = { hi: 'hi', te: 'te', ar: 'ar', bn: 'bn', ur: 'ur', en: 'en' };
  const language = SUPPORTED_LANGS[langPart] || 'en';

  return { currency, language };
}

function t(key, vars) {
  const dict = TRANSLATIONS[state.language] || TRANSLATIONS.en;
  let str = (dict[key] !== undefined) ? dict[key] : (TRANSLATIONS.en[key] || key);
  if (vars) {
    Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  }
  return str;
}

/* ============ State ============ */
function defaultState() {
  return {
    shopName: 'Salon',
    currency: 'USD',
    language: 'en',
    workers: ['Worker 1', 'Worker 2', 'Worker 3'],
    entries: [] // {id, date:'YYYY-MM-DD', time:'HH:MM', worker:string|null, type:'income'|'expense'|'shopexpense', amount:number, note:string}
  };
}

function normalizeState(data) {
  const base = defaultState();
  if (!data || typeof data !== 'object') return base;
  return {
    shopName: data.shopName || base.shopName,
    currency: data.currency || base.currency,
    language: data.language || base.language,
    workers: Array.isArray(data.workers) ? data.workers : base.workers,
    entries: Array.isArray(data.entries) ? data.entries : base.entries
  };
}

let state = defaultState();

/* ============ Auth / API ============ */
const API_BASE = '/api';
let authToken = localStorage.getItem('scToken');
let authShopCode = localStorage.getItem('scShopCode');
let authView = authToken ? null : 'login'; // 'login' | 'signup' | 'forgot' | 'recovery-shown' | null (authed)
let authBusy = false;
let authError = '';
let lastRecoveryCode = null;

function setAuth(shopCode, token) {
  authShopCode = shopCode;
  authToken = token;
  localStorage.setItem('scShopCode', shopCode);
  localStorage.setItem('scToken', token);
}
function clearAuth() {
  authShopCode = null;
  authToken = null;
  localStorage.removeItem('scShopCode');
  localStorage.removeItem('scToken');
}

async function apiCall(path, options) {
  options = options || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (authToken) {
    headers['Authorization'] = 'Bearer ' + authToken;
    headers['X-SC-Token'] = authToken;
  }
  let res;
  try {
    res = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
  } catch (e) {
    const err = new Error('Network error — check your connection and try again.');
    err.status = 0;
    throw err;
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || ('Request failed (' + res.status + ')'));
    err.status = res.status;
    throw err;
  }
  return data;
}

async function boot() {
  if (!authToken) {
    authView = 'login';
    renderApp();
    return;
  }
  try {
    const data = await apiCall('/state', { method: 'GET' });
    state = normalizeState(data);
    authView = null;
    renderApp();
  } catch (e) {
    if (e.status === 401) {
      clearAuth();
      authView = 'login';
      authError = '';
    } else {
      authView = 'login';
      authError = e.message || 'Could not reach the server.';
    }
    renderApp();
  }
}

/* ============ Helpers ============ */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function currencySymbol() {
  return (CURRENCIES[state.currency] || CURRENCIES.USD).symbol;
}
function fmtMoney(n) {
  const sign = n < 0 ? '-' : '';
  return sign + currencySymbol() + Math.abs(n).toFixed(2);
}
function localeForLang() {
  return (LANGUAGES[state.language] || LANGUAGES.en).locale;
}
function fmtDateLong(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  try {
    return dt.toLocaleDateString(localeForLang(), { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  } catch (e) {
    return dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }
}
function fmtDateShort(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  try {
    return dt.toLocaleDateString(localeForLang(), { weekday: 'short', month: 'short', day: 'numeric' });
  } catch (e) {
    return dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function entriesForDate(dateStr) {
  return state.entries.filter(e => e.date === dateStr).sort((a,b) => (a.time+a.id) < (b.time+b.id) ? 1 : -1);
}
function totalsForEntries(list) {
  let income = 0, expense = 0, shopExpense = 0;
  const perWorker = {};
  list.forEach(e => {
    if (e.type === 'income') {
      income += e.amount;
      const w = e.worker || t('unassigned');
      perWorker[w] = (perWorker[w] || 0) + e.amount;
    } else if (e.type === 'shopexpense') {
      shopExpense += e.amount;
    } else {
      expense += e.amount;
    }
  });
  return { income, expense, shopExpense, net: income - expense - shopExpense, perWorker };
}
function allDatesSorted() {
  const set = new Set(state.entries.map(e => e.date));
  return Array.from(set).sort().reverse();
}
function dateDaysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* ============ Routing ============ */
function currentView() {
  const h = location.hash.replace('#','');
  return ['today','history','settings'].includes(h) ? h : 'today';
}
function goTo(view) {
  location.hash = view;
}
window.addEventListener('hashchange', render);

/* ============ Render root ============ */
function renderApp() {
  document.body.classList.toggle('auth-mode', !!authView);
  if (authView) {
    document.documentElement.lang = 'en';
    document.documentElement.dir = 'ltr';
    document.getElementById('shopNameDisplay').textContent = 'Salon';
    document.getElementById('dateDisplay').textContent = '';
    document.getElementById('main').innerHTML = renderAuthScreen();
    wireAuthScreen();
    return;
  }
  render();
}

function render() {
  if (authView) return;
  const view = currentView();

  document.documentElement.lang = state.language;
  document.documentElement.dir = (LANGUAGES[state.language] || LANGUAGES.en).dir;

  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.getElementById('shopNameDisplay').textContent = state.shopName || 'Salon';
  document.getElementById('dateDisplay').textContent = fmtDateLong(todayStr());

  const main = document.getElementById('main');
  if (view === 'today') main.innerHTML = renderToday();
  else if (view === 'history') main.innerHTML = renderHistory();
  else main.innerHTML = renderSettings();

  if (view === 'history') wireHistory();
  if (view === 'settings') wireSettings();
}

function entryRowHtml(e) {
  const isIncome = e.type === 'income';
  const isShop = e.type === 'shopexpense';
  const kind = isIncome ? 'income' : isShop ? 'shop' : 'expense';

  const title = isIncome ? (e.worker || t('unassigned'))
    : isShop ? (e.note || t('fallback_shop_expense'))
    : (e.note || t('fallback_cash_used'));

  const sub = isIncome
    ? (e.note ? `${e.time} · ${escapeHtml(e.note)}` : `${e.time}`)
    : (e.worker ? `${e.time} · ${t('logged_by', { name: escapeHtml(e.worker) })}` : `${e.time}`);

  return `
    <div class="entry">
      <div class="entry-icon ${kind}">${isIncome ? '+' : '–'}</div>
      <div class="entry-body">
        <div class="entry-title">${escapeHtml(title)}</div>
        <div class="entry-sub">${sub}</div>
      </div>
      <div class="entry-amt num ${kind}">${isIncome ? '+' : '-'}${fmtMoney(e.amount)}</div>
      <button class="entry-del" onclick="confirmDeleteEntry('${e.id}')" aria-label="Delete entry">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ----- Entry sheet (add collection / cash used / shop expense) ----- */
function shopCategories() {
  return [
    { key: 'rent', label: t('cat_rent') },
    { key: 'supplies', label: t('cat_supplies') },
    { key: 'utilities', label: t('cat_utilities') },
    { key: 'maintenance', label: t('cat_maintenance') },
    { key: 'other', label: t('cat_other') }
  ];
}

function openEntrySheet(type) {
  const root = document.getElementById('overlayRoot');
  let selectedWorker = null;
  const workerChips = state.workers.map(w =>
    `<button type="button" class="chip" data-worker="${escapeHtml(w)}">${escapeHtml(w)}</button>`
  ).join('');

  const sheetTitle = type === 'income' ? t('sheet_title_income') : type === 'shopexpense' ? t('sheet_title_shop') : t('sheet_title_cash');
  const workerFieldLabel = type === 'income' ? t('label_which_worker') : t('label_who_logged');
  const noteLabel = type === 'income' ? t('label_note_optional') : t('label_what_for');
  const notePlaceholder = type === 'income' ? t('placeholder_note_income') : type === 'shopexpense' ? t('placeholder_note_shop') : t('placeholder_note_cash');

  const categoryChips = type === 'shopexpense'
    ? `<div class="field-label">${t('label_common_categories')}</div>
       <div class="chips" id="categoryChips">${shopCategories().map(c => `<button type="button" class="chip" data-cat="${escapeHtml(c.label)}">${escapeHtml(c.label)}</button>`).join('')}</div>`
    : '';

  root.innerHTML = `
    <div class="overlay" id="entryOverlay">
      <div class="sheet">
        <div class="sheet-title">${sheetTitle}</div>

        <div class="field-label">${workerFieldLabel}</div>
        <div class="chips" id="workerChips">${workerChips || (type === 'income' ? `<span style="color:var(--text-muted);font-size:13px;">${escapeHtml(t('empty_no_workers'))}</span>` : '')}</div>

        <div class="field-label">${t('label_amount')}</div>
        <div class="amount-input-wrap" id="amtWrap">
          <span class="currency-sym">${escapeHtml(currencySymbol())}</span>
          <input class="amount-input" id="amtInput" inputmode="decimal" placeholder="0.00" autocomplete="off">
        </div>

        ${categoryChips}

        <div class="field-label">${noteLabel}</div>
        <input class="text-input" id="noteInput" placeholder="${escapeHtml(notePlaceholder)}">

        <div class="sheet-actions">
          <button class="btn ghost" onclick="closeSheet()">${t('btn_cancel')}</button>
          <button class="btn primary" id="saveEntryBtn">${t('btn_save')}</button>
        </div>
      </div>
    </div>
  `;

  const catWrap = document.getElementById('categoryChips');
  if (catWrap) {
    catWrap.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const already = chip.classList.contains('selected');
        catWrap.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        const noteInput = document.getElementById('noteInput');
        if (!already) { chip.classList.add('selected'); noteInput.value = chip.dataset.cat; }
        else noteInput.value = '';
      });
    });
  }

  const chipsWrap = document.getElementById('workerChips');
  if (chipsWrap) {
    chipsWrap.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const already = chip.classList.contains('selected');
        chipsWrap.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        if (!already) { chip.classList.add('selected'); selectedWorker = chip.dataset.worker; }
        else selectedWorker = null;
      });
    });
  }

  const amtInput = document.getElementById('amtInput');
  const amtWrap = document.getElementById('amtWrap');
  amtInput.addEventListener('focus', () => amtWrap.classList.add('focused'));
  amtInput.addEventListener('blur', () => amtWrap.classList.remove('focused'));
  setTimeout(() => amtInput.focus(), 50);

  document.getElementById('saveEntryBtn').addEventListener('click', async () => {
    const raw = amtInput.value.trim();
    const amount = parseFloat(raw);
    if (!raw || isNaN(amount) || amount <= 0) {
      amtWrap.classList.add('focused');
      amtInput.focus();
      showToast(t('toast_enter_amount'));
      return;
    }
    if (type === 'income' && state.workers.length && !selectedWorker) {
      showToast(t('toast_pick_worker'));
      return;
    }
    const note = document.getElementById('noteInput').value.trim();
    const payload = {
      date: todayStr(),
      time: nowTime(),
      worker: selectedWorker,
      type,
      amount: Math.round(amount * 100) / 100,
      note
    };
    const saveBtn = document.getElementById('saveEntryBtn');
    saveBtn.disabled = true;
    try {
      const entry = await apiCall('/entries', { method: 'POST', body: JSON.stringify(payload) });
      state.entries.push(entry);
      closeSheet();
      render();
      showToast(type === 'income' ? t('toast_collection_added') : type === 'shopexpense' ? t('toast_shop_added') : t('toast_cash_added'));
    } catch (e) {
      saveBtn.disabled = false;
      showToast(e.message || t('toast_save_failed'));
    }
  });

  document.getElementById('entryOverlay').addEventListener('click', (ev) => {
    if (ev.target.id === 'entryOverlay') closeSheet();
  });
}
function closeSheet() {
  document.getElementById('overlayRoot').innerHTML = '';
}

function confirmDeleteEntry(id) {
  openConfirm(t('confirm_delete_title'), t('confirm_delete_text'), async () => {
    try {
      await apiCall('/entries/' + encodeURIComponent(id), { method: 'DELETE' });
      state.entries = state.entries.filter(e => e.id !== id);
      render();
      showToast(t('toast_entry_deleted'));
    } catch (e) {
      showToast(e.message || t('toast_save_failed'));
    }
  });
}

function openConfirm(title, text, onConfirm) {
  const root = document.getElementById('overlayRoot');
  root.innerHTML = `
    <div class="overlay" id="confirmOverlay">
      <div class="sheet confirm-box">
        <div class="sheet-title">${escapeHtml(title)}</div>
        <div class="confirm-text">${escapeHtml(text)}</div>
        <div class="sheet-actions">
          <button class="btn ghost" id="confirmCancel">${t('btn_cancel')}</button>
          <button class="btn primary" id="confirmOk" style="background:var(--expense);">${t('btn_delete')}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('confirmCancel').onclick = closeSheet;
  document.getElementById('confirmOk').onclick = () => { closeSheet(); onConfirm(); };
  document.getElementById('confirmOverlay').addEventListener('click', (ev) => {
    if (ev.target.id === 'confirmOverlay') closeSheet();
  });
}

/* ============ HISTORY VIEW ============ */
let historyRange = 'week'; // 'week' | 'month' | 'all'
let expandedDay = null;

function rangeDates() {
  const all = allDatesSorted();
  if (historyRange === 'all') return all;
  const cutoff = historyRange === 'week' ? dateDaysAgo(6) : dateDaysAgo(29);
  return all.filter(d => d >= cutoff);
}

function renderHistory() {
  const dates = rangeDates();
  const allEntries = dates.flatMap(d => entriesForDate(d));
  const totals = totalsForEntries(allEntries);

  const rows = dates.length ? dates.map(d => {
    const list = entriesForDate(d);
    const tt = totalsForEntries(list);
    const isExpanded = expandedDay === d;
    const detail = isExpanded ? `<div class="card" style="margin:6px 0 10px;border-radius:12px;">${list.map(entryRowHtml).join('')}</div>` : '';
    return `
      <div class="day-row" data-date="${d}">
        <div>
          <div class="day-date">${fmtDateShort(d)}</div>
          <div class="day-sub">${t('day_sub', { income: fmtMoney(tt.income), expense: fmtMoney(tt.expense), shop: fmtMoney(tt.shopExpense) })}</div>
        </div>
        <div style="display:flex;align-items:center;">
          <div class="day-net num" style="color:${tt.net < 0 ? 'var(--expense)' : 'var(--income)'}">${fmtMoney(tt.net)}</div>
          <span class="chev">${isExpanded ? '▾' : '▸'}</span>
        </div>
      </div>
      ${detail}
    `;
  }).join('') : `<div class="empty-state">${t('empty_history')}</div>`;

  return `
    <div class="range-tabs">
      <button class="range-tab ${historyRange==='week'?'active':''}" data-range="week">${t('range_week')}</button>
      <button class="range-tab ${historyRange==='month'?'active':''}" data-range="month">${t('range_month')}</button>
      <button class="range-tab ${historyRange==='all'?'active':''}" data-range="all">${t('range_all')}</button>
    </div>

    <div class="card hero" style="margin-bottom:16px;">
      <div class="label">${t('history_net_label')}</div>
      <div class="amount num ${totals.net < 0 ? 'neg' : 'pos'}">${fmtMoney(totals.net)}</div>
      <div class="tiles">
        <div class="tile income"><div class="tlabel">${t('tile_collected').toUpperCase()}</div><div class="tval num">${fmtMoney(totals.income)}</div></div>
        <div class="tile expense"><div class="tlabel">${t('tile_cash_used').toUpperCase()}</div><div class="tval num">${fmtMoney(totals.expense)}</div></div>
        <div class="tile shop"><div class="tlabel">${t('tile_shop_expenses').toUpperCase()}</div><div class="tval num">${fmtMoney(totals.shopExpense)}</div></div>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <button class="btn ghost" style="flex:none;padding:9px 16px;font-size:13px;" id="copyReportBtn">${t('btn_copy_report')}</button>
    </div>

    <div class="section-label">${t('section_days')}</div>
    <div class="card">${rows}</div>
  `;
}

function wireHistory() {
  document.querySelectorAll('.range-tab').forEach(btn => {
    btn.addEventListener('click', () => { historyRange = btn.dataset.range; expandedDay = null; render(); });
  });
  document.querySelectorAll('.day-row').forEach(row => {
    row.addEventListener('click', () => {
      const d = row.dataset.date;
      expandedDay = expandedDay === d ? null : d;
      render();
    });
  });
  const copyBtn = document.getElementById('copyReportBtn');
  if (copyBtn) copyBtn.addEventListener('click', copyReportToClipboard);
}

function copyReportToClipboard() {
  const dates = rangeDates().slice().sort();
  const rangeLabel = historyRange === 'week' ? t('report_range_week') : historyRange === 'month' ? t('report_range_month') : t('report_range_all');
  let lines = [t('report_header', { shop: state.shopName || 'Salon' }), t('report_range_label', { range: rangeLabel }), ''];
  dates.forEach(d => {
    const list = entriesForDate(d);
    const tt = totalsForEntries(list);
    lines.push(t('report_line', { date: fmtDateShort(d), income: fmtMoney(tt.income), expense: fmtMoney(tt.expense), shop: fmtMoney(tt.shopExpense), net: fmtMoney(tt.net) }));
    list.slice().reverse().forEach(e => {
      const who = e.type === 'income' ? (e.worker || t('unassigned')) : e.type === 'shopexpense' ? (e.note || t('fallback_shop_expense')) : (e.note || t('fallback_cash_used'));
      const kindTag = e.type === 'income' ? '' : e.type === 'shopexpense' ? ' ' + t('tag_shop') : ' ' + t('tag_cash');
      lines.push(`    ${e.time}  ${e.type === 'income' ? '+' : '-'}${fmtMoney(e.amount)}  ${who}${kindTag}${e.note && e.type==='income' ? ' - ' + e.note : ''}`);
    });
  });
  const allT = totalsForEntries(dates.flatMap(d => entriesForDate(d)));
  lines.push('', t('report_total', { income: fmtMoney(allT.income), expense: fmtMoney(allT.expense), shop: fmtMoney(allT.shopExpense), net: fmtMoney(allT.net) }));
  const text = lines.join('\n');

  navigator.clipboard.writeText(text).then(() => {
    showToast(t('toast_report_copied'));
  }).catch(() => {
    showToast(t('toast_copy_failed'));
  });
}

          <div class="day-sub">${t('settings_reset_sub')}</div>
        </div>
        <button class="btn ghost" style="flex:none;padding:10px 14px;color:var(--expense);" id="resetBtn">${t('btn_reset')}</button>
      </div>
    </div>

    <div class="section-label">Account</div>
    <div class="card">
      <div class="settings-row">
        <div>
          <div style="font-weight:600;font-size:14px;">Shop code</div>
          <div class="day-sub">${escapeHtml(authShopCode || '')} — use this to log in on another device</div>
        </div>
      </div>
      <div class="settings-row">
        <div style="font-weight:600;font-size:14px;">Log out of this device</div>
        <button class="btn ghost" style="flex:none;padding:10px 14px;" id="logoutBtn">Log out</button>
      </div>
    </div>
  `;
}

async function syncWorkers() {
  try {
    await apiCall('/workers', { method: 'PUT', body: JSON.stringify({ workers: state.workers }) });
  } catch (e) {
    showToast(e.message || t('toast_save_failed'));
  }
}

function wireSettings() {
  document.getElementById('shopNameInput').addEventListener('change', async (e) => {
    const val = e.target.value.trim() || 'Salon';
    state.shopName = val;
    render();
    try {
      await apiCall('/settings', { method: 'PUT', body: JSON.stringify({ shopName: val }) });
    } catch (err) {
      showToast(err.message || t('toast_save_failed'));
    }
  });

  document.getElementById('currencySelect').addEventListener('change', async (e) => {
    const val = e.target.value;
    state.currency = val;
    render();
    try {
      await apiCall('/settings', { method: 'PUT', body: JSON.stringify({ currency: val }) });
    } catch (err) {
      showToast(err.message || t('toast_save_failed'));
    }
  });

  document.getElementById('languageSelect').addEventListener('change', async (e) => {
    const val = e.target.value;
    state.language = val;
    render();
    try {
      await apiCall('/settings', { method: 'PUT', body: JSON.stringify({ language: val }) });
    } catch (err) {
      showToast(err.message || t('toast_save_failed'));
    }
  });

  document.querySelectorAll('[data-role="worker-name"]').forEach(input => {
    input.addEventListener('change', (e) => {
      const idx = Number(e.target.dataset.idx);
      const val = e.target.value.trim();
      if (val) { state.workers[idx] = val; syncWorkers(); }
      else render();
    });
  });

  document.querySelectorAll('[data-role="remove-worker"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      const name = state.workers[idx];
      openConfirm(t('confirm_remove_worker_title', { name }), t('confirm_remove_worker_text'), () => {
        state.workers.splice(idx, 1);
        render();
        syncWorkers();
      });
    });
  });

  document.getElementById('addWorkerBtn').addEventListener('click', () => {
    const input = document.getElementById('newWorkerInput');
    const val = input.value.trim();
    if (!val) { showToast(t('toast_enter_name')); return; }
    state.workers.push(val);
    render();
    syncWorkers();
  });

  document.getElementById('backupBtn').addEventListener('click', () => {
    const text = JSON.stringify(state, null, 2);
    navigator.clipboard.writeText(text).then(() => {
      showToast(t('toast_data_copied'));
    }).catch(() => showToast(t('toast_copy_failed')));
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    openConfirm(t('confirm_reset_title'), t('confirm_reset_text'), async () => {
      try {
        await apiCall('/entries', { method: 'DELETE' });
        state.entries = [];
        render();
        showToast(t('toast_data_reset'));
      } catch (err) {
        showToast(err.message || t('toast_save_failed'));
      }
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    openConfirm('Log out?', 'You will need the shop code and PIN to log back in on this device.', async () => {
      try { await apiCall('/logout', { method: 'POST' }); } catch (e) {}
      clearAuth();
      state = defaultState();
      authView = 'login';
      authError = '';
      renderApp();
    });
  });
}

/* ============ Auth screens ============ */
function renderAuthScreen() {
  if (authView === 'signup') return renderSignupView();
  if (authView === 'forgot') return renderForgotView();
  if (authView === 'recovery-shown') return renderRecoveryShownView();
  return renderLoginView();
}

function renderLoginView() {
  return `
    <div class="auth-wrap">
      <div class="card auth-card">
        <h2 class="auth-title">Shop login</h2>
        ${authError ? `<div class="auth-error">${escapeHtml(authError)}</div>` : ''}
        <div class="field-label">Shop code</div>
        <input class="text-input" id="authShopCode" placeholder="e.g. AB12CD" autocapitalize="characters" autocomplete="off">
        <div class="field-label">PIN</div>
        <input class="text-input" id="authPin" type="password" inputmode="numeric" placeholder="4–8 digit PIN" autocomplete="off">
        <button class="btn primary" style="width:100%;margin-top:16px;" id="authSubmitBtn" ${authBusy ? 'disabled' : ''}>${authBusy ? 'Please wait…' : 'Log in'}</button>
        <div class="auth-links">
          <a id="gotoSignup">Set up this shop</a>
          <a id="gotoForgot">Forgot PIN?</a>
        </div>
      </div>
    </div>
  `;
}

function renderSignupView() {
  return `
    <div class="auth-wrap">
      <div class="card auth-card">
        <h2 class="auth-title">Set up your shop</h2>
        ${authError ? `<div class="auth-error">${escapeHtml(authError)}</div>` : ''}
        <div class="field-label">Shop name</div>
        <input class="text-input" id="authShopName" placeholder="e.g. Chandu's Salon" autocomplete="off">
        <div class="field-label">Choose a PIN (4–8 digits)</div>
        <input class="text-input" id="authNewPin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
        <button class="btn primary" style="width:100%;margin-top:16px;" id="authSubmitBtn" ${authBusy ? 'disabled' : ''}>${authBusy ? 'Please wait…' : 'Create shop account'}</button>
        <div class="auth-links">
          <a id="gotoLogin">Already have a shop code? Log in</a>
        </div>
      </div>
    </div>
  `;
}

function renderForgotView() {
  return `
    <div class="auth-wrap">
      <div class="card auth-card">
        <h2 class="auth-title">Reset PIN</h2>
        ${authError ? `<div class="auth-error">${escapeHtml(authError)}</div>` : ''}
        <div class="field-label">Shop code</div>
        <input class="text-input" id="authShopCode" placeholder="Shop code" autocapitalize="characters" autocomplete="off">
        <div class="field-label">Recovery code</div>
        <input class="text-input" id="authRecoveryCode" placeholder="From when you set up this shop" autocomplete="off">
        <div class="field-label">New PIN (4–8 digits)</div>
        <input class="text-input" id="authNewPin" type="password" inputmode="numeric" placeholder="New PIN" autocomplete="off">
        <button class="btn primary" style="width:100%;margin-top:16px;" id="authSubmitBtn" ${authBusy ? 'disabled' : ''}>${authBusy ? 'Please wait…' : 'Reset PIN'}</button>
        <div class="auth-links">
          <a id="gotoLogin">Back to log in</a>
        </div>
      </div>
    </div>
  `;
}

function renderRecoveryShownView() {
  return `
    <div class="auth-wrap">
      <div class="card auth-card">
        <h2 class="auth-title">Save your recovery code</h2>
        <p class="auth-note">Write this down somewhere safe — a notebook, a note on the owner's phone. If this shop ever forgets its PIN, this code is the only way back in. We can't recover it for you.</p>
        <div class="recovery-code">${escapeHtml(lastRecoveryCode || '')}</div>
        <div class="field-label">Shop code (used to log in on any device)</div>
        <div class="recovery-code" style="font-size:18px;">${escapeHtml(authShopCode || '')}</div>
        <button class="btn primary" style="width:100%;margin-top:16px;" id="authContinueBtn">I've saved it — continue</button>
      </div>
    </div>
  `;
}

function wireAuthScreen() {
  const submitBtn = document.getElementById('authSubmitBtn');
  if (submitBtn) submitBtn.addEventListener('click', handleAuthSubmit);

  const gotoSignup = document.getElementById('gotoSignup');
  if (gotoSignup) gotoSignup.addEventListener('click', () => { authView = 'signup'; authError = ''; renderApp(); });

  const gotoForgot = document.getElementById('gotoForgot');
  if (gotoForgot) gotoForgot.addEventListener('click', () => { authView = 'forgot'; authError = ''; renderApp(); });

  const gotoLogin = document.getElementById('gotoLogin');
  if (gotoLogin) gotoLogin.addEventListener('click', () => { authView = 'login'; authError = ''; renderApp(); });

  const continueBtn = document.getElementById('authContinueBtn');
  if (continueBtn) continueBtn.addEventListener('click', () => { authView = null; lastRecoveryCode = null; boot(); });

  document.querySelectorAll('.auth-card input').forEach((inp) => {
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuthSubmit(); });
  });
}

async function handleAuthSubmit() {
  if (authBusy) return;
  authError = '';

  if (authView === 'login') {
    const shopCode = (document.getElementById('authShopCode').value || '').trim().toUpperCase();
    const pin = (document.getElementById('authPin').value || '').trim();
    if (!shopCode || !pin) { authError = 'Enter your shop code and PIN.'; renderApp(); return; }
    authBusy = true; renderApp();
    try {
      const data = await apiCall('/login', { method: 'POST', body: JSON.stringify({ shopCode, pin }) });
      setAuth(data.shopCode, data.token);
      authBusy = false;
      await boot();
    } catch (e) {
      authBusy = false;
      authError = e.message || 'Login failed.';
      renderApp();
    }
    return;
  }

  if (authView === 'signup') {
    const shopName = (document.getElementById('authShopName').value || '').trim();
    const pin = (document.getElementById('authNewPin').value || '').trim();
    if (!shopName) { authError = 'Enter a shop name.'; renderApp(); return; }
    if (!/^[0-9]{4,8}$/.test(pin)) { authError = 'PIN must be 4-8 digits.'; renderApp(); return; }
    authBusy = true; renderApp();
    try {
      const defaults = detectDefaultsFromLocale();
      const data = await apiCall('/signup', { method: 'POST', body: JSON.stringify({ shopName, pin, currency: defaults.currency, language: defaults.language }) });
      setAuth(data.shopCode, data.token);
      lastRecoveryCode = data.recoveryCode;
      authBusy = false;
      authView = 'recovery-shown';
      renderApp();
    } catch (e) {
      authBusy = false;
      authError = e.message || 'Could not create shop account.';
      renderApp();
    }
    return;
  }

  if (authView === 'forgot') {
    const shopCode = (document.getElementById('authShopCode').value || '').trim().toUpperCase();
    const recoveryCode = (document.getElementById('authRecoveryCode').value || '').trim();
    const newPin = (document.getElementById('authNewPin').value || '').trim();
    if (!shopCode || !recoveryCode || !/^[0-9]{4,8}$/.test(newPin)) { authError = 'Fill in all fields; PIN must be 4-8 digits.'; renderApp(); return; }
    authBusy = true; renderApp();
    try {
      await apiCall('/reset-pin', { method: 'POST', body: JSON.stringify({ shopCode, recoveryCode, newPin }) });
      authBusy = false;
      authView = 'login';
      authError = '';
      renderApp();
      showToast('PIN reset — log in with your new PIN.');
    } catch (e) {
      authBusy = false;
      authError = e.message || 'Could not reset PIN.';
      renderApp();
    }
    return;
  }
}

/* ============ Init ============ */
boot();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
